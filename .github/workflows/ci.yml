name: VAS Continuous Integration

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: vas_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install black flake8 pytest pytest-asyncio pytest-cov aiosqlite requests isort mypy email-validator redis sendgrid twilio pyjwt slowapi
        
    - name: Lint with Flake8
      run: |
        flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 backend/ --count --max-complexity=35 --max-line-length=150 --ignore=E128,E231,E251,E261,E302,E305,E402,E501,E712,E722,E741,F401,F541,F811,F841,W291,W292,W293,W503,E123,E226,C901 --statistics
        
    - name: Check code formatting (Black)
      run: |
        black --check backend/api/auth.py backend/api/users.py backend/services/evidence_chain.py
        
    - name: Check imports (isort)
      run: |
        isort --check-only backend/api/auth.py backend/api/users.py backend/services/evidence_chain.py
        
    - name: Type checking (mypy)
      run: |
        mypy backend/api/auth.py backend/api/users.py backend/services/evidence_chain.py --ignore-missing-imports || true
        
    - name: Run Pytest
      env:
        DATABASE_URL: postgresql://root:testpassword@localhost:5432/vas_test_db
        SECRET_KEY: testsecretkey1234567890
        PROJECT_NAME: "VAS Test System"
        API_V1_STR: "/api/v1"
      run: |
        # Ensure we run tests from backend dir so imports resolve correctly
        cd backend && pytest -v
