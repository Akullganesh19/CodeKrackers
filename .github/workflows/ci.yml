name: VAS Continuous Integration

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: vas_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install black flake8 pytest pytest-asyncio isort mypy pytest-cov requests
        
    - name: Lint with Flake8
      run: |
        flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 backend/ --count --max-complexity=10 --max-line-length=88 --statistics
        
    - name: Check code formatting (Black)
      run: |
        black --check backend/
        
    - name: Check imports (isort)
      run: |
        isort --check-only backend/
        
    - name: Type checking (mypy)
      run: |
        mypy backend/ --ignore-missing-imports
        
    - name: Run Pytest
      env:
        DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/vas_test_db
        SECRET_KEY: testsecretkey1234567890
        PROJECT_NAME: "VAS Test System"
        API_V1_STR: "/api/v1"
      run: |
        # Ensure we run tests from backend dir so imports resolve correctly
        cd backend && pytest -v
