name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 pytest pytest-cov pytest-asyncio

      - name: Lint with flake8
        run: |
          flake8 backend/ --count --max-complexity=35 --max-line-length=150 --ignore=E123,E128,E226,E231,E251,E261,E302,E305,E306,E402,E501,E712,E722,E741,F401,F541,F811,F841,W291,W292,W293,W391,W503,C901 --statistics

      - name: Test with pytest
        run: |
          pytest backend/
