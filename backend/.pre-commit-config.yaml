# Pre-commit configuration for Python code quality
# See https://pre-commit.com for more information

repos:
  # General hooks - file formatting and basic checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        exclude: \.pyc$
      - id: end-of-file-fixer
        exclude: \.pyc$
      - id: check-yaml
        exclude: \.pyc$
      - id: check-json
        exclude: \.pyc$
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=88]

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        name: isort (python)
        args: [--profile=black, --line-length=88]

  # Python linters
  - repo: https://github.com/pycqa/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        additional_dependencies: [flake8-bugbear, flake8-comprehensions, flake8-docstrings, flake8-isort, pep8-naming]
        args: [--max-line-length=88, --extend-ignore=E203]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.0.1
    hooks:
      - id: mypy
        additional_dependencies: [types-requests, types-PyYAML, types-redis]
        exclude: ^migrations/|^tests/|^venv/|^\.venv/

  # Security checks
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: [-c, .bandit.yaml]
        additional_dependencies: ["bandit[toml]"]

# Exclude patterns for common directories and files to skip
exclude: |
  ^migrations/
  ^__pycache__/
  ^\.venv/
  ^venv/
  ^env/
  ^\.pytest_cache/
  ^\.mypy_cache/
  ^\.tox/
  ^\.coverage
  ^htmlcov/
  ^site/
  ^build/
  ^dist/
  ^\.eggs/
  ^\.env$
  ^\.env\..*
  ^env\.ini$
  ^credentials\.json$
  ^secrets\.json$
  ^\.secrets\.baseline$