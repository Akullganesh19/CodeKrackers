version: '3.8'

services:
  # Database service for user and threat persistence
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: vsdp_root_password
      MYSQL_DATABASE: vsdp_db
    ports:
      - "3306:3306"
    volumes:
      - vsdp_db_data:/var/lib/mysql

  # Redis service for rate limiting and socket buffering
  redis:
    image: redis:7-alpine
    restart: always

  # FastAPI backend service
  backend:
    build: ./backend
    restart: always
    environment:
      DATABASE_URL: mysql+aiomysql://root:vsdp_root_password@db:3306/vsdp_db
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-vsdp-fallback-security-key}
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  # Next.js frontend service
  frontend:
    build: .
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  vsdp_db_data:
