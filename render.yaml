services:
  # ─── FastAPI Backend ───
  - type: web
    name: vas-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vas-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: vas-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PROJECT_NAME
        value: "VAS Defense System"
      - key: API_V1_STR
        value: "/api/v1"

  # ─── Next.js Frontend ───
  - type: web
    name: vas-frontend
    env: node
    buildCommand: npm install && npm run build -- --webpack
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: vas-backend
          property: url
        suffix: /api/v1

  # ─── Redis (for Rate Limiting/RASP) ───
  - type: redis
    name: vas-redis
    ipAllowList: [] # Only allow internal connections

databases:
  - name: vas-db
    databaseName: vas_prod
    user: vas_admin
